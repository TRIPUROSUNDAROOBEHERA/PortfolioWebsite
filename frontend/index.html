  <body class="bg-[#f8faff] text-slate-900 font-['Plus_Jakarta_Sans',sans-serif]">
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          var search = window.location.search || '';
          var hash = (window.location.hash || '').replace('#', '').toLowerCase();
          var sMatch = search.match(/[?&]skill=([^&]+)/);
          var pMatch = search.match(/[?&]project=([^&]+)/);
          var target = sMatch ? 'skills' : (pMatch ? 'projects' : (hash || ''));
          if (target && target !== 'home') {
            var saved = sessionStorage.getItem('landing_pos_' + target);
            if (saved) {
              window.scrollTo(0, parseInt(saved, 10));
            }
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>

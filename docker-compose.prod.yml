version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: prod_portfolio_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-portfolio_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prod_root_pass}
      MYSQL_USER: ${DB_USER:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prod_secure_pass}
    volumes:
      - prod_mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: prod_portfolio_backend
    restart: always
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - DEBUG=0
      - DB_NAME=${DB_NAME:-portfolio_db}
      - DB_USER=${DB_USER:-portfolio_user}
      - DB_PASSWORD=${DB_PASSWORD:-prod_secure_pass}
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: prod_portfolio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/staticfiles:/app/backend/staticfiles
      - ./backend/media:/app/backend/media
    depends_on:
      - backend

volumes:
  prod_mysql_data:
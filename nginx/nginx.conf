powershell -Command "New-Item -ItemType Directory -Force -Path 'deployment/nginx'; @'
upstream backend_server {
    server backend:8000;
}
map `$http_upgrade `$connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml;
    add_header X-Frame-Options \"DENY\" always;
    add_header X-Content-Type-Options \"nosniff\" always;
    add_header X-XSS-Protection \"1; mode=block\" always;
    add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;
    location /assets/ {
        expires 1y;
        add_header Cache-Control \"public, max-age=31536000, immutable\";
        access_log off;
    }
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade `$http_upgrade;
        proxy_set_header Connection `$connection_upgrade;
        proxy_set_header Host `$host;
        proxy_set_header X-Real-IP `$remote_addr;
        proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto `$scheme;
        proxy_redirect off;
    }
    location ~ ^/(static|media)/ {
        proxy_pass http://backend_server;
        proxy_set_header Host `$host;
        proxy_set_header X-Real-IP `$remote_addr;
        proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto `$scheme;
    }
    location / {
        try_files `$uri `$uri/ /index.html;
    }
}
'@ | Out-File -Encoding utf8 'deployment/nginx/nginx.conf'"
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank you for reaching out</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 32px 16px; color: #334155; }
    .card { max-width: 540px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 32px; }
    .header { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
    p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
    .quote-box { background: #f8fafc; border-left: 3px solid #2563eb; padding: 12px 16px; border-radius: 4px; font-size: 13.5px; margin: 20px 0; color: #475569; }
    .footer { font-size: 12px; color: #94a3b8; margin-top: 24px; border-top: 1px solid #f1f5f9; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Hello {{ name }},</div>
    <p>Thank you for getting in touch through my portfolio. I have received your message and will review it promptly.</p>
    
    <div class="quote-box">
      <strong>Your Inquiry:</strong><br>
      "{{ message }}"
    </div>

    <p>I typically respond within 24 to 48 hours.</p>

    <div class="footer">
      Best regards,<br>
      <strong>Your Name</strong> &bull; MCA Graduate & Software Developer
    </div>
  </div>
</body>
</html>

{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:"Portfolio CMS Admin" }}{% endblock %}

{% block branding %}
<div id="site-branding">
  <div style="display: flex; align-items: center; gap: 10px;">
    <div style="width: 32px; height: 32px; border-radius: 6px; background-color: #2563eb; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">
      AS
    </div>
    <h1 id="site-name" style="margin: 0; font-size: 16px; font-weight: 700;">
      <a href="{% url 'admin:index' %}" style="color: #0f172a; text-decoration: none;">Portfolio Administration</a>
    </h1>
  </div>
</div>
{% endblock %}

{% block extrahead %}
  {{ block.super }}
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'css/admin.css' %}">
  <script src="{% static 'js/admin.js' %}" defer></script>
{% endblock %}

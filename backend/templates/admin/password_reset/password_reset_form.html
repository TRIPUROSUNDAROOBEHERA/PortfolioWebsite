{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Portfolio Administration</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 45%, #06b6d4 100%);
            padding: 20px;
        }
        .portal-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            text-align: center;
        }
        .key-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35);
            margin-bottom: 16px;
        }
        h2 { font-size: 22px; font-weight: 800; color: #0f172a; }
        p { color: #64748b; font-size: 13.5px; margin-top: 6px; line-height: 1.5; }
        
        .error-alert {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 18px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-form { 
            margin-top: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            text-align: left; 
        }
        label { font-size: 13px; font-weight: 700; color: #334155; }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-top: 6px;
        }
        .input-box i { position: absolute; left: 14px; color: #94a3b8; font-size: 14px; pointer-events: none; }
        .input-box input {
            width: 100%;
            height: 46px;
            padding: 0 16px 0 42px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            font-size: 13.5px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
        }
        .input-box input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .btn-submit {
            height: 46px;
            width: 100%;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
            text-align: center;
            transition: color 0.15s;
        }
        .btn-back:hover { color: #0f172a; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="key-icon">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2>Forgot Password?</h2>
        <p>Enter your administrator email address below to receive password recovery instructions.</p>

        <!-- Form Validation Errors (if invalid email submitted) -->
        {% if form.errors %}
            <div class="error-alert">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Please enter a valid registered administrator email address.</span>
            </div>
        {% endif %}

        <form method="post" action="{% url 'admin_password_reset' %}" class="reset-form" id="passwordResetForm">
            {% csrf_token %}
            <div>
                <label for="id_email">Administrator Email</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input 
                        type="email" 
                        name="email" 
                        id="id_email" 
                        placeholder="24jnf00084@svcn.ac.in" 
                        required 
                        autocomplete="email"
                        autofocus
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Send Reset Link</span>
                <i class="fa-solid fa-paper-plane" style="font-size: 12px;"></i>
            </button>

            <a href="/admin/login/" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Return to Login
            </a>
        </form>
    </div>

    <script>
        // Visual feedback while communicating with Gmail SMTP server
        const resetForm = document.getElementById('passwordResetForm');
        const submitBtn = document.getElementById('submitBtn');

        if (resetForm && submitBtn) {
            resetForm.addEventListener('submit', function() {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Transmitting Email...';
            });
        }
    </script>
</body>
</html>

{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Dispatched - Portfolio Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 45%, #06b6d4 100%);
            padding: 20px;
        }
        .portal-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
            text-align: center;
        }
        .mail-icon {
            width: 60px;
            height: 60px;
            background: #dcfce7;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #16a34a;
            font-size: 26px;
            margin-bottom: 16px;
        }
        h2 { font-size: 22px; font-weight: 800; color: #0f172a; }
        p { color: #64748b; font-size: 13.5px; margin-top: 10px; line-height: 1.5; }
        .btn-return {
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="mail-icon">
            <i class="fa-regular fa-paper-plane"></i>
        </div>
        <h2>Reset Link Sent!</h2>
        <p>If an account exists with the provided email, instructions to reset your password have been sent.</p>
        <a href="/admin/login/" class="btn-return">
            <i class="fa-solid fa-arrow-left"></i> Return to Admin Login
        </a>
    </div>
</body>
</html>

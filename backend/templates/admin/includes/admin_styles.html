<style>
    :root {
        --sidebar-bg: #091338;
        --sidebar-nav-active: linear-gradient(135deg, #0070f3 0%, #38bdf8 100%);
        --header-gradient: linear-gradient(90deg, #0c1a4b 0%, #1e3a8a 35%, #2563eb 70%, #4338ca 100%);
        --main-bg: #f4f7fe;
        --card-bg: #ffffff;
        --text-dark: #0f172a;
        --text-gray: #8e9bb5;
        --border-light: #e2e8f0;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
        background-color: var(--main-bg);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        position: relative;
        overflow-x: hidden;
    }

    .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        z-index: 990;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .sidebar-backdrop.active {
        display: block;
        opacity: 1;
    }

    .admin-sidebar {
        width: 260px;
        min-width: 260px;
        background: linear-gradient(180deg, #0c1947 0%, #081131 100%);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100vh;
        z-index: 1000;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
    }

    body.sidebar-open {
        overflow: hidden !important;
        touch-action: none !important;
    }

    .sidebar-brand {
        padding: 22px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brand-group {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-badge {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        color: #ffffff;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
    }

    .brand-text h2 {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.2;
        color: #ffffff;
        letter-spacing: -0.2px;
    }

    .brand-text span {
        font-size: 11px;
        color: #798bb4;
    }

    .sidebar-close-btn {
        display: none;
        background: none;
        border: none;
        color: #94a3b8;
        font-size: 20px;
        cursor: pointer;
        padding: 4px;
    }

    .sidebar-nav {
        padding: 10px 14px;
        flex: 1;
        overflow-y: auto;
    }

    .nav-category {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #586994;
        font-weight: 800;
        margin: 16px 12px 6px 12px;
    }

    .nav-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 14px;
        color: #8fa0c7;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        border-radius: 12px;
        transition: all 0.2s ease;
        margin-bottom: 4px;
    }

    .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.06);
    }

    .nav-link.active {
        background: linear-gradient(135deg, #0070f3 0%, #2563eb 100%);
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(0, 112, 243, 0.45);
    }

    .nav-link-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .nav-link-left i {
        font-size: 15px;
        width: 18px;
        text-align: center;
    }

    .badge-count {
        background: #ef4444;
        color: #ffffff;
        font-size: 10.5px;
        font-weight: 800;
        padding: 1px 7px;
        border-radius: 20px;
        transition: opacity 0.3s;
    }

    .sidebar-bottom-card {
        margin: 16px;
        padding: 18px 14px;
        border-radius: 18px;
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #6366f1 100%);
        text-align: center;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .trophy-glow-icon {
        font-size: 32px;
        color: #fde047;
        margin-bottom: 6px;
        filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.6));
        display: inline-block;
    }

    .sidebar-bottom-card h4 {
        font-size: 13.5px;
        color: #ffffff;
        font-weight: 800;
    }

    .sidebar-bottom-card p {
        font-size: 11px;
        color: #dbeafe;
        margin-top: 3px;
    }

    .admin-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-width: 0;
        overflow-y: auto;
    }

    .admin-topbar {
        height: 64px;
        background: var(--header-gradient);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(16px, 2.5vw, 28px);
        position: sticky;
        top: 0;
        z-index: 900;
        box-shadow: 0 4px 18px rgba(12, 26, 75, 0.15);
    }

    .topbar-left {
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
    }

    .menu-toggle-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
    }

    .search-wrapper { position: relative; }

    .top-search-capsule {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.12);
        padding: 7px 18px;
        border-radius: 30px;
        width: clamp(220px, 28vw, 360px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(8px);
        transition: all 0.2s;
    }

    .top-search-capsule:focus-within {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.5);
    }

    .top-search-capsule input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 13px;
        width: 100%;
        color: #ffffff;
    }

    .top-search-capsule input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .search-results-dropdown {
        display: none;
        position: absolute;
        top: 48px;
        left: 0;
        width: 100%;
        min-width: 300px;
        max-height: 380px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-light);
        overflow-y: auto;
        z-index: 10000;
        padding: 8px;
    }

    .search-results-dropdown.active { display: block; }

    .search-result-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: 10px;
        text-decoration: none;
        color: #1e293b;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.15s ease;
    }

    .search-result-item:hover { background: #eff6ff; color: #2563eb; }
    .search-result-item i { margin-right: 8px; color: #3b82f6; }
    .search-result-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: #f1f5f9; color: #64748b; }
    .search-no-results { padding: 16px; text-align: center; font-size: 12.5px; color: #94a3b8; }

    .topbar-actions {
        display: flex;
        align-items: center;
        gap: 18px;
        position: relative;
    }

    .action-item-wrap { position: relative; }

    .top-icon-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 18px;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.9;
    }

    .top-icon-btn:hover { opacity: 1; }

    .badge-pill-num {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #ef4444;
        color: #ffffff;
        font-size: 9.5px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 10px;
        border: 2px solid #1e3a8a;
    }

    .notifications-dropdown-menu {
        display: none;
        position: absolute;
        top: 50px;
        right: 100px;
        width: 320px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
        border: 1px solid var(--border-light);
        z-index: 10000;
        padding: 12px;
        color: var(--text-dark);
    }

    .notifications-dropdown-menu.active { display: block; }

    .notif-menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 8px;
    }

    .notif-menu-header h5 { font-size: 13.5px; font-weight: 800; }
    .notif-clear-btn { font-size: 11px; font-weight: 700; color: #2563eb; background: none; border: none; cursor: pointer; }

    .notif-row-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 8px;
        border-radius: 10px;
        text-decoration: none;
        color: #334155;
        transition: background 0.15s;
    }

    .notif-row-item:hover { background: #f8fafc; }
    .notif-icon-circle {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
    }
    .notif-icon-circle.green { background: #dcfce7; color: #16a34a; }
    .notif-icon-circle.blue { background: #dbeafe; color: #2563eb; }
    .notif-icon-circle.orange { background: #ffedd5; color: #ea580c; }
    .notif-body-text h6 { font-size: 12.5px; font-weight: 700; }
    .notif-body-text span { font-size: 11px; color: #94a3b8; }

    .top-user-profile-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: none;
        color: #ffffff;
        cursor: pointer;
        padding: 4px;
        border-radius: 30px;
        transition: opacity 0.2s;
    }

    .top-user-profile-btn:hover { opacity: 0.95; }

    .user-avatar-round {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #ffffff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 13px;
    }

    .user-meta-text { text-align: left; }
    .user-meta-text h5 { font-size: 13px; font-weight: 800; color: #ffffff; line-height: 1.1; }
    .user-meta-text span { font-size: 11px; color: #bfdbfe; }

    .user-dropdown-menu {
        display: none;
        position: absolute;
        top: 50px;
        right: 0;
        width: 220px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
        border: 1px solid var(--border-light);
        z-index: 10000;
        padding: 8px;
        color: var(--text-dark);
    }

    .user-dropdown-menu.active { display: block; }

    .user-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.15s;
    }

    .user-dropdown-item:hover { background: #eff6ff; color: #2563eb; }
    .user-dropdown-item i { font-size: 14px; width: 16px; text-align: center; color: #64748b; }
    .user-dropdown-item:hover i { color: #2563eb; }
    .user-dropdown-divider { height: 1px; background: #f1f5f9; margin: 6px 0; }
    .logout-menu-item { color: #ef4444 !important; }
    .logout-menu-item i { color: #ef4444 !important; }
    .logout-menu-item:hover { background: #fee2e2 !important; }

    .admin-content {
        padding: clamp(16px, 2.5vw, 32px);
        flex: 1;
    }

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 0;
        padding: 20px;
        transition: opacity 0.2s ease;
    }

    .modal-overlay.active { display: flex; opacity: 1; }

    .modal-box {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        border-radius: 24px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    }

    .modal-signout-icon {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #fee2e2;
        color: #ef4444;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin-bottom: 16px;
    }

    .modal-box h3 { font-size: 19px; font-weight: 800; color: #0f172a; }
    .modal-box p { font-size: 13.5px; color: #64748b; margin-top: 6px; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }

    .btn-modal-cancel {
        flex: 1;
        padding: 11px;
        border-radius: 12px;
        border: 1.5px solid #e2e8f0;
        background: #ffffff;
        font-weight: 700;
        font-size: 13.5px;
        color: #475569;
        cursor: pointer;
    }

    .btn-modal-logout {
        flex: 1;
        padding: 11px;
        border-radius: 12px;
        border: none;
        background: #ef4444;
        color: #ffffff;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
    }

    @media (max-width: 1023px) {
        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            max-width: 85vw;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior: contain !important;
            touch-action: pan-y !important;
            transform: translateX(-100%);
            z-index: 1050;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.45);
        }
        .admin-sidebar.open {
            transform: translateX(0);
        }
        .sidebar-close-btn {
            display: flex;
        }
        .sidebar-backdrop {
            touch-action: none;
            overscroll-behavior: contain;
        }
        .sidebar-bottom-card {
            margin: 16px 14px 36px 14px;
        }
    }

    @media (max-width: 767px) {
        .search-wrapper { display: none; }
        .user-meta-text { display: none; }
    }
</style>

<header class="admin-topbar">
    <div class="topbar-left">
        <button type="button" class="menu-toggle-btn" id="openSidebarBtn" aria-label="Toggle Menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="search-wrapper">
            <div class="top-search-capsule">
                <i class="fa-solid fa-magnifying-glass" style="color: rgba(255, 255, 255, 0.7); font-size: 13px;"></i>
                <input type="text" id="globalAdminSearch" placeholder="Search modules, projects, blogs..." autocomplete="off">
            </div>
            <div class="search-results-dropdown" id="searchResultsDropdown"></div>
        </div>
    </div>

    <div class="topbar-actions">
        <!-- Notifications Trigger & Dropdown Menu -->
        <div class="action-item-wrap" style="position: relative;">
            <button type="button" class="top-icon-btn" id="headerNotifBtn" title="Notifications" style="position: relative;">
                <i class="fa-regular fa-bell"></i>
                <!-- Dynamic Real-Time Counter Badge -->
                <span class="badge-pill-num" id="headerNotifBadge" style="display: none; position: absolute; top: 2px; right: 2px; background-color: #ef4444; color: #ffffff; font-size: 10px; font-weight: 800; border-radius: 9999px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; border: 2px solid #1e293b;">0</span>
            </button>

            <!-- Notification Dropdown Menu -->
            <div class="notifications-dropdown-menu" id="notificationsMenu" style="display: none; position: absolute; right: 0; top: 125%; width: 360px; background: #ffffff; border-radius: 16px; box-shadow: 0 15px 45px rgba(0,0,0,0.18); border: 1px solid #e2e8f0; z-index: 1050; overflow: hidden;">
                <div class="notif-menu-header" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #f1f5f9; background: #fafafa;">
                    <h5 style="margin: 0; font-size: 14px; font-weight: 800; color: #0f172a;">Notifications</h5>
                    <button type="button" class="notif-clear-btn" id="clearNotifBtn" style="background: none; border: none; font-size: 11.5px; font-weight: 700; color: #4f46e5; cursor: pointer;">Mark all as read</button>
                </div>
                
                <!-- Live Notification Feed List -->
                <div id="dynamicNotifList" style="max-height: 340px; overflow-y: auto; padding: 4px 0;">
                    <div style="padding: 24px; text-align: center; color: #94a3b8; font-size: 13px;">Checking notifications...</div>
                </div>

                <div style="padding: 10px 18px; text-align: center; border-top: 1px solid #f1f5f9; background: #ffffff;">
                    <a href="/admin/notifications/notification/" style="font-size: 12px; font-weight: 700; color: #3b82f6; text-decoration: none;">View All in Admin &rarr;</a>
                </div>
            </div>
        </div>

        <!-- View Public API Icon -->
        <a href="/api/" target="_blank" class="top-icon-btn" title="View Public API">
            <i class="fa-solid fa-globe"></i>
        </a>

        <!-- User Profile Trigger & Dropdown -->
        <div class="action-item-wrap" style="position: relative;">
            <button type="button" class="top-user-profile-btn" id="userProfileBtn">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" 
                     alt="S. Ram Kumar" 
                     class="user-avatar-round" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="user-avatar-round" style="display: none;">SR</div>

                <div class="user-meta-text">
                    <h5>S. Ram Kumar</h5>
                    <span>Administrator</span>
                </div>
                <i class="fa-solid fa-chevron-down" style="font-size: 11px; color: #bfdbfe; margin-left: 2px;"></i>
            </button>

            <div class="user-dropdown-menu" id="userProfileMenu" style="display: none;">
                <a href="/admin/accounts/user/1/change/" class="user-dropdown-item">
                    <i class="fa-regular fa-user"></i>
                    <span>My Profile</span>
                </a>
                <a href="/admin/settings/sitesetting/" class="user-dropdown-item">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Account Settings</span>
                </a>
                <a href="/admin/password_change/" class="user-dropdown-item">
                    <i class="fa-solid fa-key"></i>
                    <span>Change Password</span>
                </a>
                <a href="/admin/audit_logs/auditlog/" class="user-dropdown-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Activity History</span>
                </a>
                <div class="user-dropdown-divider"></div>
                <button type="button" class="user-dropdown-item logout-menu-item" id="menuLogoutBtn" style="width: 100%; border: none; background: none; cursor: pointer; text-align: left;">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>
</header>

<!-- CSRF Token for Mark-As-Read Requests -->
{% csrf_token %}

<script>
(() => {
    let unreadCount = 0;
    let initialLoadDone = false;
    let currentNotifications = [];

    const notifBtn = document.getElementById('headerNotifBtn');
    const notifBadge = document.getElementById('headerNotifBadge');
    const sidebarBadge = document.getElementById('sidebarNotifBadge');
    const notifMenu = document.getElementById('notificationsMenu');
    const notifList = document.getElementById('dynamicNotifList');
    const clearBtn = document.getElementById('clearNotifBtn');

    // Profile Dropdown Elements
    const userBtn = document.getElementById('userProfileBtn');
    const userMenu = document.getElementById('userProfileMenu');

    // ─── 1. Crystal Audio Chime (Web Audio API) ───
    function playChime() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            // Play crisp two-tone alert: E6 (1318Hz) -> A6 (1760Hz)
            osc.frequency.setValueAtTime(1318.51, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1760.00, ctx.currentTime + 0.12);

            gain.gain.setValueAtTime(0.22, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.62);
        } catch (err) {
            console.debug("Chime playback waiting for user click interaction:", err);
        }
    }

    // ─── 2. Format ISO Date to Human-Friendly Date & Time ───
    function formatDateTime(dateStr) {
        if (!dateStr) return 'Just now';
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return d.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });
    }

    // ─── 3. Fetch Live Notifications ───
    async function loadNotifications() {
        try {
            const res = await fetch('/api/notifications/?ordering=-created_at', {
                headers: { 'Accept': 'application/json' },
                credentials: 'same-origin'
            });

            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data) ? data : (data.results || []);
            currentNotifications = items;

            const unreads = items.filter(n => !n.is_read);
            const newCount = unreads.length;

            // Scenario 1: First login load - If unread messages exist, trigger sound & badge
            if (!initialLoadDone) {
                initialLoadDone = true;
                if (newCount > 0) {
                    playChime();
                }
            } 
            // Scenario 2: Incoming message while admin is on the dashboard
            else if (newCount > unreadCount) {
                playChime();
            }

            unreadCount = newCount;
            updateBadgeUI(unreadCount);
            renderNotificationItems(items);
        } catch (err) {
            console.error("Error fetching notifications:", err);
        }
    }

    // ─── 4. Update Badge Numbers Everywhere ───
    function updateBadgeUI(count) {
        if (count > 0) {
            const text = count > 99 ? '99+' : count;
            if (notifBadge) {
                notifBadge.textContent = text;
                notifBadge.style.display = 'inline-block';
            }
            if (sidebarBadge) {
                sidebarBadge.textContent = text;
                sidebarBadge.style.display = 'inline-block';
            }
        } else {
            if (notifBadge) notifBadge.style.display = 'none';
            if (sidebarBadge) sidebarBadge.style.display = 'none';
        }
    }

    // ─── 5. Render Notification Rows with Date & Time ───
    function renderNotificationItems(items) {
        if (!notifList) return;

        if (!items || items.length === 0) {
            notifList.innerHTML = '<div style="padding: 24px; text-align: center; color: #94a3b8; font-size: 13px;">No notifications found.</div>';
            return;
        }

        notifList.innerHTML = items.slice(0, 6).map(n => `
            <a href="/admin/notifications/notification/${n.id}/change/" style="display: flex; gap: 12px; padding: 12px 16px; text-decoration: none; border-bottom: 1px solid #f8fafc; background: ${n.is_read ? '#ffffff' : '#f0fdf4'}; transition: background 0.15s;">
                <div style="width: 36px; height: 36px; border-radius: 10px; background: ${n.is_read ? '#f1f5f9' : '#dcfce7'}; color: ${n.is_read ? '#64748b' : '#16a34a'}; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div style="flex: 1; min-width: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px;">
                        <h6 style="margin: 0; font-size: 13px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            ${n.title || 'Notification'}
                        </h6>
                        <span style="font-size: 10.5px; color: #94a3b8; white-space: nowrap; flex-shrink: 0;">
                            ${formatDateTime(n.created_at)}
                        </span>
                    </div>
                    <p style="margin: 3px 0 0 0; font-size: 12px; line-height: 1.4; color: #475569; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${n.message || ''}
                    </p>
                </div>
            </a>
        `).join('');
    }

    // ─── 6. Dismiss/Mark As Read on Bell Click ───
    async function dismissAllNotifications() {
        if (unreadCount === 0) return;

        // Instantly hide the red numbers from the dashboard
        unreadCount = 0;
        updateBadgeUI(0);

        // Send read patch to backend
        try {
            const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
            const csrfToken = csrfInput ? csrfInput.value : '';

            // Mark unread items as read in the database
            const unreadIds = currentNotifications.filter(n => !n.is_read).map(n => n.id);
            for (const id of unreadIds) {
                fetch(`/api/notifications/${id}/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    body: JSON.stringify({ is_read: true }),
                    credentials: 'same-origin'
                }).catch(() => {});
            }

            // Mark local array as read
            currentNotifications.forEach(n => n.is_read = true);
            renderNotificationItems(currentNotifications);
        } catch (err) {
            console.error("Error clearing notifications:", err);
        }
    }

    // ─── 7. Event Listeners ───
    if (notifBtn && notifMenu) {
        notifBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = notifMenu.style.display === 'block';

            if (!isOpen) {
                notifMenu.style.display = 'block';
                // Clicking the bell turns off the red badge counter
                dismissAllNotifications();
            } else {
                notifMenu.style.display = 'none';
            }

            if (userMenu) userMenu.style.display = 'none';
        });
    }

    if (clearBtn) {
        clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dismissAllNotifications();
        });
    }

    // Profile menu toggle
    if (userBtn && userMenu) {
        userBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userMenu.style.display = userMenu.style.display === 'block' ? 'none' : 'block';
            if (notifMenu) notifMenu.style.display = 'none';
        });
    }

    // Close menus when clicking outside
    document.addEventListener('click', () => {
        if (notifMenu) notifMenu.style.display = 'none';
        if (userMenu) userMenu.style.display = 'none';
    });

    // ─── 8. Initial Run & Continuous 6-Second Polling ───
    loadNotifications();
    setInterval(loadNotifications, 6000);
})();
</script>

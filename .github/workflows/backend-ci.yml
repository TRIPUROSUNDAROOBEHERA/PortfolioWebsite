name: Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  django-tests:
    name: Run Django Lint & Unit Tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-test-secret-key-safe-for-github-actions-only
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-django

      - name: Code Quality & Syntax Check (Flake8)
        run: |
          # Stop build immediately if there are syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings and code-style formatting checks (non-blocking)
          flake8 backend --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Validate Django Configuration
        run: |
          cd backend
          python manage.py check

      - name: Check Database Migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run Backend Unit Tests
        run: |
          cd backend
          python manage.py test --verbosity=2